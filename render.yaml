services:
  - type: web
    name: catedra-portal
    runtime: node
    plan: free
    rootDir: render-bridge
    buildCommand: "echo Zero-dependency Node bridge ready"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APK_DOWNLOAD_URL
        value: https://github.com/diegocataldoarellano-hub/catedra-android/releases/latest/download/Catedra-v1.0.0.apk

